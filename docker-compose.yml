services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardekho-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@host.docker.internal:5432/socialgenie?schema=public
      DIRECT_URL: postgresql://postgres:password@host.docker.internal:5432/socialgenie?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cardekho-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
